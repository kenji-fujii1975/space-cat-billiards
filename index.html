<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>WallSlide Pool</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; }
    /* タイトル画面でステージ背景が見えないように初期は黒のみ */
    body {
      background-color: #000;
      background-image: none;
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP";
    }
    #canvas { display:block; width:100vw; height:100vh; touch-action: none; background: transparent; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
  (function(){
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // === Assets ===
    const catImg = new Image();
    catImg.decoding = 'async';
    catImg.src = 'catball.png';

    const zabutonImg = new Image();
    zabutonImg.decoding = 'async';
    zabutonImg.src = 'zabuton.png';

    const topImg = new Image();
    topImg.decoding = 'async';
    topImg.src = 'top.png';

    const endImg = new Image();
    endImg.decoding = 'async';
    endImg.src = 'end.png';

    const hitBase = new Audio('cat.mp3');
    hitBase.preload = 'auto';

    // BGM
    const bgm = new Audio('catballbgm.mp3');
    bgm.preload = 'auto';
    bgm.loop = true;
    bgm.volume = 0.4;

    // Preload backgrounds
    const bg1 = new Image(); bg1.src = 'back.png';
    const bg2 = new Image(); bg2.src = 'back2.png';
    const bg3 = new Image(); bg3.src = 'back3.png';

    // Audio unlock on first gesture (iOS)
    let audioUnlocked = false;
    let lastHitAt = 0;
    function safeStartBgm(){
      try {
        bgm.muted = false; bgm.volume = 0.4;
        if (bgm.paused) { bgm.currentTime = 0; }
        const p = bgm.play();
        if (p && typeof p.catch === 'function') p.catch(()=>{});
      } catch(_){}
    }

    function unlockAudioOnce(){
      if (audioUnlocked) return;
      const unlocks = [];
      hitBase.volume = 0;
      unlocks.push(
        hitBase.play().then(()=>{ hitBase.pause(); hitBase.currentTime = 0; hitBase.volume = 1; })
      );
      // BGMはユーザー操作のスタック上で起動
      unlocks.push(
        (async()=>{ safeStartBgm(); })()
      );
      Promise.allSettled(unlocks).finally(()=>{ audioUnlocked = true; });
    }
    window.addEventListener('touchstart', unlockAudioOnce, {passive:false});
    window.addEventListener('mousedown', unlockAudioOnce);
    if (window.PointerEvent) window.addEventListener('pointerdown', unlockAudioOnce, {passive:false}); hitBase.currentTime = 0; hitBase.volume = 1; })
      );
      unlocks.push(
        bgm.play().then(()=>{ bgm.muted = false; bgm.volume = 0.4; }).catch(()=>{})
      );
      Promise.allSettled(unlocks).finally(()=>{ audioUnlocked = true; });
    }
    window.addEventListener('touchstart', unlockAudioOnce, {passive:false});
    window.addEventListener('mousedown', unlockAudioOnce);
    if (window.PointerEvent) window.addEventListener('pointerdown', unlockAudioOnce, {passive:false});

    function playHit(){
      const now = performance.now();
      if (now - lastHitAt < 120) return; // cooldown
      lastHitAt = now;
      try{
        const a = hitBase.cloneNode();
        a.volume = 0.9;
        a.play().catch(()=>{});
      }catch(e){}
    }

    let catReady=false, catError=false, zabutonReady=false, topReady=false, endReady=false;
    catImg.onload=()=>{catReady = catImg.naturalWidth>0 && catImg.naturalHeight>0;};
    catImg.onerror=()=>{catError=true;};
    zabutonImg.onload=()=>{zabutonReady=true;};
    topImg.onload=()=>{topReady=true;};
    endImg.onload=()=>{endReady=true;};

    function fitCanvas(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
    fitCanvas(); window.addEventListener('resize', fitCanvas);

    const clampLevel = (n)=> Math.min(3, Math.max(1, n));
    let level = 1;

    const world={ width:()=>canvas.width, height:()=>canvas.height, holeR:26 };
    const rng=(a,b)=>Math.random()*(b-a)+a;

    // Ball & tuning
    const ball={ x:120, y:120, r:80, vx:60, vy:35, rotation:0 };
    const IMG_SCALE=0.7, SPEED_SCALE=0.5, ROT_SPEED=0.25;

    // Stage entities/state
    let walls=[];
    let win=false, goalAnim=0, goal=null, postWinHandled=false;

    // Overlay
    let msgText = '';
    let msgTimer = 0;
    const MSG_DUR = 1.5;
    let awaitingTap = false;
    let msgType = null; // 'next' | 'congratsTap' | null
    let msgRect = null;

    // Game state
    // 'title' -> waiting tap with top.png
    // 'play'  -> gameplay
    // 'ending' -> show end.png and wait for tap to return title
    let gameState = 'title';
    let showTitleOnCanvas = true; // 冗長表示: 背景+canvasの両方で描く安全策

    function setMessage(t, type){
      msgText=t; msgTimer=0; msgType=type||null;
      awaitingTap = (msgType === 'next' || msgType === 'congratsTap');
    }

    function applyBackground(){
      let url = 'back.png';
      if (level === 2) url = 'back2.png';
      if (level === 3) url = 'back3.png';
      document.body.style.backgroundColor = '#000';
      document.body.style.backgroundImage = `url('${url}')`;
      document.body.style.backgroundPosition = 'center center';
      document.body.style.backgroundRepeat = 'no-repeat';
      document.body.style.backgroundSize = 'cover';
      document.body.style.backgroundAttachment = 'fixed';
    }

    function makeLevel(){
      applyBackground();
      const W=world.width(), H=world.height();
      ball.x=rng(40,80); ball.y=rng(40,80);
      const base=70+(level-1)*12;
      const sp=base*SPEED_SCALE;
      const ang=rng(0,Math.PI*2);
      ball.vx=Math.cos(ang)*sp; ball.vy=Math.sin(ang)*sp;

      // short zabuton bar
      const w=100,h=25,x=W/2-w/2,y=H-120;
      walls=[{x,y,w,h,id:0,draggable:true}];

      win=false; goalAnim=0; goal=null; postWinHandled=false;
      msgText=''; msgType=null; awaitingTap=false; msgRect=null;
    }

    function resetLevel(){ makeLevel(); }

    function startGame(){
      level = 1; gameState = 'play';
      resetLevel();
    }

    function goTitle(){
      gameState = 'title';
      level = 1;
      awaitingTap = false; msgText = ''; msgType = null; msgRect = null; win=false; postWinHandled=false; goal=null; goalAnim=0;
      // タイトルは body 背景に top.png を表示
      document.body.style.backgroundColor = '#000';
      document.body.style.backgroundImage = "url('top.png')";
      document.body.style.backgroundPosition = 'center center';
      document.body.style.backgroundRepeat = 'no-repeat';
      document.body.style.backgroundSize = 'contain';
      document.body.style.backgroundAttachment = 'fixed';
      showTitleOnCanvas = true; // 念のためcanvasにも描く
      // タイトルではBGMは鳴らさない
      try { if (!bgm.paused) { bgm.pause(); } } catch(_){}
    } } catch(_){}
    } } catch(_){}
    }); } } catch(_){}
    }); } } catch(_){}
    }

    // Drag handling + tap-to-next + title tap
    let dragId=null, dragOffset={x:0,y:0};
    function posFromEvent(e){
      if (e.touches && e.touches.length){ const t = e.touches[0]; return {x:t.clientX, y:t.clientY}; }
      if (e.changedTouches && e.changedTouches.length){ const t = e.changedTouches[0]; return {x:t.clientX, y:t.clientY}; }
      return {x:e.clientX, y:e.clientY};
    }

    function onDown(e){
      const p=posFromEvent(e);

      // Title tap to start
      if (gameState === 'title'){
        // どこでもタップで開始（仕様変更）
        startGame();
        // BGM起動
        if (!audioUnlocked) unlockAudioOnce();
        try { if (bgm.paused) { bgm.currentTime = 0; bgm.play().catch(()=>{}); } } catch(_){}
        e.preventDefault();
        return;
      }

      if (gameState === 'ending'){
        if (endReady && endImg.naturalWidth>0){
          const iw = endImg.naturalWidth, ih = endImg.naturalHeight;
          const s = Math.min(W/iw, H/ih);
          const dw = iw*s, dh = ih*s;
          const dx = (W-dw)/2, dy = (H-dh)/2;
          ctx.drawImage(endImg, dx, dy, dw, dh);
        } else {
          ctx.fillStyle = '#000';
          ctx.fillRect(0,0,W,H);
        }
        return;
      }

      // Ending tap to title
      if (gameState === 'ending'){
        goTitle();
        e.preventDefault();
        return;
      }

      // If waiting to start next stage or restart, check hitbox of the label/button
      if (awaitingTap && msgRect){
        const {x, y, w, h} = msgRect; // top-left box
        if (p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h){
          if (msgType === 'next'){
            level = clampLevel(level + 1);
          } else if (msgType === 'congratsTap'){
            level = 1; gameState = 'play';
          }
          awaitingTap = false; msgText = ''; msgType = null; msgRect = null;
          resetLevel();
          e.preventDefault();
          return;
        }
      }

      if (gameState !== 'play') { e.preventDefault(); return; }

      // Drag bar
      const wb = walls[0];
      if(wb && p.x>=wb.x&&p.x<=wb.x+wb.w&&p.y>=wb.y&&p.y<=wb.y+wb.h){
        dragId=wb.id; dragOffset.x=p.x-wb.x; dragOffset.y=p.y-wb.y;
      }
      e.preventDefault();
    }
    function onMove(e){
      if(dragId===null || gameState!=='play') return;
      const p=posFromEvent(e);
      const w=walls[0];
      if(!w) return;
      w.x=Math.min(world.width()-w.w, Math.max(0, p.x-dragOffset.x));
      w.y=Math.min(world.height()-w.h, Math.max(0, p.y-dragOffset.y));
      e.preventDefault();
    }
    function onUp(e){ dragId=null; e.preventDefault(); }
    canvas.addEventListener('touchstart', onDown, {passive:false});
    canvas.addEventListener('touchmove', onMove, {passive:false});
    canvas.addEventListener('touchend', onUp, {passive:false});
    canvas.addEventListener('mousedown', onDown);
    canvas.addEventListener('click', onDown); // Safari の click 発火対策
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    // Pointer Events (Safari/iOS含む幅広い端末向け)
    if (window.PointerEvent) {
      canvas.addEventListener('pointerdown', onDown, {passive:false});
      canvas.addEventListener('pointermove', onMove, {passive:false});
      canvas.addEventListener('pointerup', onUp, {passive:false});
      canvas.addEventListener('pointercancel', onUp, {passive:false});
    }

    // Collision helpers
    function circleRectCollide(cx,cy,cr,rx,ry,rw,rh){
      const closestX=Math.max(rx,Math.min(cx,rx+rw));
      const closestY=Math.max(ry,Math.min(cy,ry+rh));
      const dx=cx-closestX, dy=cy-closestY;
      return dx*dx + dy*dy <= cr*cr;
    }
    function reflectOnRect(ball,rect){
      const{ x:cx,y:cy,r:cr}=ball; const{ x:rx,y:ry,w:rw,h:rh}=rect;
      const penLeft=Math.abs((cx+cr)-rx);
      const penRight=Math.abs((rx+rw)-(cx-cr));
      const penTop=Math.abs((cy+cr)-ry);
      const penBottom=Math.abs((ry+rh)-(cy-cr));
      const minPen=Math.min(penLeft,penRight,penTop,penBottom);
      const restitution=0.98;
      if(minPen===penLeft){ball.x=rx-cr;ball.vx=-Math.abs(ball.vx)*restitution;}
      else if(minPen===penRight){ball.x=rx+rw+cr;ball.vx=Math.abs(ball.vx)*restitution;}
      else if(minPen===penTop){ball.y=ry-cr;ball.vy=-Math.abs(ball.vy)*restitution;}
      else{ball.y=ry+rh+cr;ball.vy=Math.abs(ball.vy)*restitution;}
      playHit();
    }

    let last=performance.now();

    function update(dt){
      if (gameState !== 'play') return; // nothing to update on title

      if (msgText && msgType !== 'next' && msgType !== 'congratsTap') msgTimer += dt;
      ball.rotation += dt*ROT_SPEED;

      if (!win){
        ball.x += ball.vx*dt;
        ball.y += ball.vy*dt;

        if(ball.x-ball.r<0){ball.x=ball.r;ball.vx=Math.abs(ball.vx);playHit();}
        if(ball.x+ball.r>world.width()){ball.x=world.width()-ball.r;ball.vx=-Math.abs(ball.vx);playHit();}
        if(ball.y-ball.r<0){ball.y=ball.r;ball.vy=Math.abs(ball.vy);playHit();}
        if(ball.y+ball.r>world.height()){ball.y=world.height()-ball.r;ball.vy=-Math.abs(ball.vy);playHit();}

        const w=walls[0];
        if(w && circleRectCollide(ball.x,ball.y,ball.r,w.x,w.y,w.w,w.h)) reflectOnRect(ball,w);

        // Invisible goal: still detect near center
        const hx=world.width()/2, hy=world.height()/2, hr=world.holeR;
        const dx=ball.x-hx, dy=ball.y-hy, d2=dx*dx+dy*dy;
        if (d2 < hr*hr){
          win = true;
          goalAnim = 0;
          goal = { hx, hy, sx: ball.x, sy: ball.y };
          ball.vx = 0; ball.vy = 0;
        }
      } else {
        if (goal && goalAnim < 1){
          goalAnim = Math.min(1, goalAnim + dt / 0.9);
          const t = goalAnim*goalAnim;
          ball.x = goal.sx + (goal.hx - goal.sx)*t;
          ball.y = goal.sy + (goal.hy - goal.sy)*t;
        }
        if (!postWinHandled && goalAnim >= 1){
          postWinHandled = true;
          if (level < 3){
            setMessage('NEXT STAGE!', 'next');
          } else {
            // move to ending screen (no message overlay)
            msgText=''; msgType=null; awaitingTap=false; msgRect=null;
            gameState = 'ending';
          }
        } else {
            setMessage('Congratulations!', 'congratsTap');
          }
        }
      }
    }

    function draw(){
      const W=world.width(), H=world.height();
      ctx.clearRect(0,0,W,H);

      if (gameState === 'title'){
        // draw top.png centered with contain
        if (topReady && topImg.naturalWidth>0){
          const iw = topImg.naturalWidth, ih = topImg.naturalHeight;
          const s = Math.min(W/iw, H/ih);
          const dw = iw*s, dh = ih*s;
          const dx = (W-dw)/2, dy = (H-dh)/2;
          ctx.drawImage(topImg, dx, dy, dw, dh);
        } else {
          // fallback background
          ctx.fillStyle = '#000';
          ctx.fillRect(0,0,W,H);
        }
        // no other UI on title (tap anywhere to start)
        msgRect = null; // not used on title
        return;
      }

      // (hole is invisible)

      // bar (zabuton)
      const w=walls[0];
      if (zabutonReady && w){
        ctx.drawImage(zabutonImg, w.x, w.y, w.w, w.h);
      } else if (w) {
        ctx.fillStyle='rgba(0,255,255,0.4)';
        pathRoundRect(ctx, w.x,w.y,w.w,w.h,10); ctx.fill();
      }

      const shrink = win ? (1 - 0.85*(goalAnim*goalAnim)) : 1;
      const drawScale = IMG_SCALE * shrink;

      if (catReady && !catError && catImg.naturalWidth>0){
        ctx.save();
        ctx.translate(ball.x, ball.y);
        ctx.rotate(ball.rotation);
        const size = ball.r*2*drawScale;
        try { ctx.drawImage(catImg, -size/2, -size/2, size, size); }
        catch(e){ catError=true; }
        ctx.restore();
      } else {
        ctx.fillStyle='#10b981';
        ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r*drawScale,0,Math.PI*2); ctx.fill();
      }

      // overlay message (button-like when awaitingTap)
      msgRect = null;
      if (msgText){
        let alpha = 1;
        if (msgType !== 'next' && msgType !== 'congratsTap'){
          const t = Math.min(1, msgTimer/MSG_DUR);
          alpha = 1 - t;
        }
        if (alpha > 0){
          ctx.save();
          ctx.globalAlpha = alpha;
          const fontSize = Math.max(36, Math.min(W, H) * 0.12);
          ctx.font = `900 ${fontSize}px system-ui, -apple-system`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const x = W/2, y = H*0.25;
          const metrics = ctx.measureText(msgText);
          const tw = metrics.width, th = fontSize * 1.2, pad = 24;
          if (awaitingTap){
            const rx = x - tw/2 - pad;
            const ry = y - th/2 - pad/2;
            const rw = tw + pad*2;
            const rh = th + pad;
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            pathRoundRect(ctx, rx, ry, rw, rh, 14); ctx.fill();
            msgRect = { x: rx, y: ry, w: rw, h: rh };
          }
          ctx.fillStyle = '#ffffff';
          ctx.fillText(msgText, x, y);
          ctx.restore();
        }
      }
    }

    // roundRect polyfill
    function pathRoundRect(ctx,x,y,w,h,r){
      const rr = Math.max(0, Math.min(r, w/2, h/2));
      ctx.beginPath();
      ctx.moveTo(x+rr, y);
      ctx.lineTo(x+w-rr, y);
      ctx.quadraticCurveTo(x+w, y, x+w, y+rr);
      ctx.lineTo(x+w, y+h-rr);
      ctx.quadraticCurveTo(x+w, y+h, x+w-rr, y+h);
      ctx.lineTo(x+rr, y+h);
      ctx.quadraticCurveTo(x, y+h, x, y+h-rr);
      ctx.lineTo(x, y+rr);
      ctx.quadraticCurveTo(x, y, x+rr, y);
      ctx.closePath();
    }

    function loop(ts){
      const dt=Math.min(0.032,(ts-last)/1000); last=ts;
      try{ update(dt); draw(); }
      catch(e){ console.error('render error', e); }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // Start at title
    goTitle();

    // ==== Minimal runtime tests (console only) ====
    function assert(name, cond){
      if (!assert.results) assert.results = [];
      const pass = !!cond;
      assert.results.push({name, pass});
      if (!pass) console.error('[TEST FAIL]', name); else console.log('[TEST OK]', name);
    }
    // Tests
    assert('clampLevel lower bound', clampLevel(0) === 1);
    assert('clampLevel upper bound', clampLevel(10) === 3);
    assert('initial state is title', gameState === 'title');
    (function(){
      const r = {x:10, y:10, w:100, h:40};
      const inside = (px,py)=> px>=r.x && px<=r.x+r.w && py>=r.y && py<=r.y+r.h;
      assert('hitbox inside', inside(50,30) === true);
      assert('hitbox outside', inside(5,5) === false);
    })();
    (function(){
      const hit = circleRectCollide(50,50,20,40,40,40,10);
      const miss = circleRectCollide(10,10,5,40,40,40,10);
      assert('circle-rect hit', hit === true);
      assert('circle-rect miss', miss === false);
    })();
    // posFromEvent pointer/touch/mouse
    (function(){
      const te = {touches:[{clientX:12, clientY:34}]};
      const pe = {clientX:56, clientY:78};
      const r1 = posFromEvent(te); const r2 = posFromEvent(pe);
      assert('posFromEvent touch', r1.x===12 && r1.y===34);
      assert('posFromEvent mouse', r2.x===56 && r2.y===78);
    })();
    // title start area logic
    (function(){
      const H = 100;
      const inLower = (y)=> y >= H/2;
      assert('title start area yes', inLower(60) === true);
      assert('title start area no', inLower(40) === false);
    })();
    // Audio tests (non-fatal)
    assert('bgm object exists', !!bgm);
    assert('bgm loop enabled', bgm.loop === true);
    assert('sfx object exists', !!hitBase);
    assert('end image exists var', typeof endImg === 'object');
