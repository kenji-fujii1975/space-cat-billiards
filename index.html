<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>WallSlide Pool</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: url('back.png') center center / cover no-repeat fixed;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP";
    }
    #hud {
      position: fixed; top: 0; left: 0; width: 100%; display: flex; gap: 8px; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.5); color: white; padding: 10px; z-index: 10;
    }
    #hud .btn {
      background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.3);
      padding: 8px 12px; border-radius: 10px; font-weight: 600;
    }
    #hud .btn:active { transform: translateY(1px); }
    #hud .pill { padding: 8px 10px; border-radius: 999px; background: rgba(255,255,255,.2); font-variant-numeric: tabular-nums; }
    #status { position: fixed; right: 10px; bottom: 10px; font-size: 12px; color: #fff; background: rgba(0,0,0,.45); padding: 6px 10px; border-radius: 10px; }
    #canvas { display:block; width:100vw; height:100vh; touch-action: none; }
  </style>
</head>
<body>
  <div id="hud">
    <button id="btnReset" class="btn">リセット</button>
    <button id="btnNext" class="btn">次のレベル</button>
    <div id="level" class="pill">LV 1</div>
    <div id="time" class="pill">00:00</div>
  </div>
  <div id="status">loading assets…</div>
  <canvas id="canvas"></canvas>

  <script>
  (()=>{
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const hudLevel = document.getElementById('level');
    const hudTime = document.getElementById('time');
    const btnReset = document.getElementById('btnReset');
    const btnNext = document.getElementById('btnNext');
    const statusEl = document.getElementById('status');

    // === Assets ===
    const catImg = new Image(); // ball texture
    catImg.decoding = 'async';
    catImg.src = 'catball.png';

    const hitBase = new Audio('cat.mp3'); // collision sfx
    hitBase.preload = 'auto';
    let audioUnlocked = false;
    let lastHitAt = 0;

    function unlockAudioOnce(){
      if (audioUnlocked) return;
      // Attempt to unlock by starting & immediately pausing
      hitBase.volume = 0;
      hitBase.play().then(()=>{
        hitBase.pause();
        hitBase.currentTime = 0;
        hitBase.volume = 1;
        audioUnlocked = true;
        window.removeEventListener('touchstart', unlockAudioOnce, {passive:false});
        window.removeEventListener('mousedown', unlockAudioOnce);
      }).catch(()=>{ /* ignore, will retry on next gesture */ });
    }
    window.addEventListener('touchstart', unlockAudioOnce, {passive:false});
    window.addEventListener('mousedown', unlockAudioOnce);

    function playHit(){
      const now = performance.now();
      if (now - lastHitAt < 120) return; // simple cooldown to avoid spam
      lastHitAt = now;
      try{
        const a = hitBase.cloneNode();
        a.volume = 0.9;
        a.play().catch(()=>{});
      }catch(e){}
    }

    let catReady = false;
    let catError = false;

    catImg.addEventListener('load', () => {
      catReady = catImg.naturalWidth > 0 && catImg.naturalHeight > 0;
      statusEl.textContent = catReady ? 'assets: ok' : 'catball.png invalid';
    }, { once: true });

    catImg.addEventListener('error', () => {
      catError = true;
      statusEl.textContent = 'catball.png not found';
      console.warn('Failed to load catball.png');
    }, { once: true });

    function fitCanvas(){
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvas.width = w;
      canvas.height = h;
    }
    fitCanvas();
    window.addEventListener('resize', fitCanvas);

    let level = 1;
    let startedAt = performance.now();

    const world = {
      width: () => canvas.width,
      height: () => canvas.height,
      holeR: 26,
    };

    const rng = (min, max)=> Math.random()*(max-min)+min;

    const ball = { x: 120, y: 120, r: 80, vx: 60, vy: 35, rotation: 0 };
    const IMG_SCALE = 0.7; // ★ 画像の描画を70%に縮小
    let walls = [];

    function makeLevel(){
      const W = world.width(), H = world.height();
      ball.x = rng(40, 80);
      ball.y = rng(40, 80);
      const speed = 70 + (level-1)*12;
      const ang = rng(0, Math.PI*2);
      ball.vx = Math.cos(ang) * speed;
      ball.vy = Math.sin(ang) * speed;

      // Bar length to half (以前は ~200px)
      const w = 100, h = 25;
      const x = W/2 - w/2;
      const y = H - 120;
      walls = [{ x, y, w, h, id:0, draggable:true }];

      startedAt = performance.now();
      hudLevel.textContent = `LV ${level}`;
    }

    function resetLevel(){ makeLevel(); }

    let dragId = null;
    let dragOffset = {x:0, y:0};

    function posFromEvent(e){
      if (e.touches && e.touches.length){
        const t = e.touches[0];
        return { x: t.clientX, y: t.clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }

    function onDown(e){
      const p = posFromEvent(e);
      const w = walls[0];
      if (p.x>=w.x && p.x<=w.x+w.w && p.y>=w.y && p.y<=w.y+w.h){
        dragId = w.id;
        dragOffset.x = p.x - w.x;
        dragOffset.y = p.y - w.y;
      }
      e.preventDefault();
    }
    function onMove(e){
      if (dragId===null) return;
      const p = posFromEvent(e);
      const w = walls[0];
      w.x = Math.min(world.width()-w.w, Math.max(0, p.x - dragOffset.x));
      w.y = Math.min(world.height()-w.h, Math.max(0, p.y - dragOffset.y));
      e.preventDefault();
    }
    function onUp(e){ dragId = null; e.preventDefault(); }

    canvas.addEventListener('touchstart', onDown, {passive:false});
    canvas.addEventListener('touchmove', onMove, {passive:false});
    canvas.addEventListener('touchend', onUp, {passive:false});
    canvas.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);

    function circleRectCollide(cx, cy, cr, rx, ry, rw, rh){
      const closestX = Math.max(rx, Math.min(cx, rx+rw));
      const closestY = Math.max(ry, Math.min(cy, ry+rh));
      const dx = cx - closestX; const dy = cy - closestY;
      return dx*dx + dy*dy <= cr*cr;
    }

    function reflectOnRect(ball, rect){
      const {x:cx,y:cy,r:cr} = ball;
      const {x:rx,y:ry,w:rw,h:rh} = rect;
      const penLeft = Math.abs((cx+cr) - rx);
      const penRight = Math.abs((rx+rw) - (cx-cr));
      const penTop = Math.abs((cy+cr) - ry);
      const penBottom = Math.abs((ry+rh) - (cy-cr));
      const minPen = Math.min(penLeft, penRight, penTop, penBottom);
      const restitution = 0.98;
      if (minPen === penLeft) {
        ball.x = rx - cr; ball.vx = -Math.abs(ball.vx) * restitution;
      } else if (minPen === penRight) {
        ball.x = rx + rw + cr; ball.vx = Math.abs(ball.vx) * restitution;
      } else if (minPen === penTop) {
        ball.y = ry - cr; ball.vy = -Math.abs(ball.vy) * restitution;
      } else {
        ball.y = ry + rh + cr; ball.vy = Math.abs(ball.vy) * restitution;
      }
      playHit();
    }

    let last = performance.now();
    let win = false;

    function update(dt){
      if (win) return;
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;
      ball.rotation += dt * 0.5; // slow rotation

      // Screen bounds (with hit sound)
      if (ball.x - ball.r < 0){ ball.x = ball.r; ball.vx = Math.abs(ball.vx); playHit(); }
      if (ball.x + ball.r > world.width()){ ball.x = world.width() - ball.r; ball.vx = -Math.abs(ball.vx); playHit(); }
      if (ball.y - ball.r < 0){ ball.y = ball.r; ball.vy = Math.abs(ball.vy); playHit(); }
      if (ball.y + ball.r > world.height()){ ball.y = world.height() - ball.r; ball.vy = -Math.abs(ball.vy); playHit(); }

      const w = walls[0];
      if (circleRectCollide(ball.x, ball.y, ball.r, w.x, w.y, w.w, w.h)) reflectOnRect(ball, w);

      const hx = world.width()/2, hy = world.height()/2; const hr = world.holeR;
      const dx = ball.x - hx, dy = ball.y - hy; const d2 = dx*dx + dy*dy;
      if (d2 < (hr * hr)){
        win = true;
        ball.vx = ball.vy = 0;
        alert('クリア！🎉');
      }

      const t = Math.floor((performance.now() - startedAt)/1000);
      const mm = String(Math.floor(t/60)).padStart(2,'0');
      const ss = String(t%60).padStart(2,'0');
      hudTime.textContent = `${mm}:${ss}`;
    }

    function draw(){
      const W = world.width(), H = world.height();
      ctx.clearRect(0,0,W,H);

      // goal
      const hx = W/2, hy = H/2, hr = world.holeR;
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.beginPath(); ctx.arc(hx,hy,hr,0,Math.PI*2); ctx.fill();

      // draggable bar (shorter)
      const w = walls[0];
      ctx.fillStyle = 'rgba(0,255,255,0.4)';
      ctx.beginPath(); ctx.roundRect(w.x, w.y, w.w, w.h, 10);
      ctx.fill();

      // ball (image 70% scale or placeholder)
      if (catReady && !catError && catImg.naturalWidth > 0) {
        try {
          ctx.save();
          ctx.translate(ball.x, ball.y);
          ctx.rotate(ball.rotation);
          const size = ball.r * 2 * IMG_SCALE;
          ctx.drawImage(catImg, -size/2, -size/2, size, size);
          ctx.restore();
        } catch (e) {
          console.warn('drawImage failed, fallback to circle', e);
          catError = true;
        }
      }
      if (!catReady || catError) {
        ctx.fillStyle = '#10b981';
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r * IMG_SCALE, 0, Math.PI*2); ctx.fill();
      }
    }

    function loop(ts){
      const dt = Math.min(0.032, (ts - last)/1000);
      last = ts;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    btnReset.addEventListener('click', ()=>{ win=false; resetLevel(); });
    btnNext.addEventListener('click', ()=>{ level++; win=false; resetLevel(); });

    resetLevel();

    // --- Simple runtime tests ---
    function assert(name, cond){
      if (!assert.results) assert.results = [];
      assert.results.push({ name, pass: !!cond });
    }
    function showTestResults(){
      const fails = (assert.results||[]).filter(r=>!r.pass);
      if (fails.length){
        statusEl.textContent = 'tests failed: ' + fails.map(f=>f.name).join(', ');
        statusEl.style.background = 'rgba(180,0,0,.65)';
      } else {
        statusEl.textContent = (catReady && !catError ? 'assets: ok' : statusEl.textContent) + ' | tests ok';
      }
    }
    assert('canvas exists', !!canvas && !!ctx);
    assert('image object exists', !!catImg);
    setTimeout(()=>{ assert('image valid or placeholder draws', catReady ? catImg.naturalWidth>0 : true); showTestResults(); }, 500);
  })();
  </script>
</body>
</html>
