<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>WallSlide Pool</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: url('back.png') center center / cover no-repeat fixed;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP";
    }
    #canvas { display:block; width:100vw; height:100vh; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
  (()=>{
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // === Assets ===
    const catImg = new Image();
    catImg.decoding = 'async';
    catImg.src = 'catball.png';

    const zabutonImg = new Image();
    zabutonImg.decoding = 'async';
    zabutonImg.src = 'zabuton.png';

    const hitBase = new Audio('cat.mp3');
    hitBase.preload = 'auto';

    // Preload backgrounds (optional; body style will swap)
    const bg1 = new Image(); bg1.src = 'back.png';
    const bg2 = new Image(); bg2.src = 'back2.png';

    // Audio unlock on first gesture (iOS)
    let audioUnlocked = false;
    let lastHitAt = 0;
    function unlockAudioOnce(){
      if (audioUnlocked) return;
      hitBase.volume = 0;
      hitBase.play().then(()=>{
        hitBase.pause(); hitBase.currentTime = 0; hitBase.volume = 1; audioUnlocked = true;
      }).catch(()=>{});
    }
    window.addEventListener('touchstart', unlockAudioOnce, {passive:false});
    window.addEventListener('mousedown', unlockAudioOnce);

    function playHit(){
      const now = performance.now();
      if (now - lastHitAt < 120) return;
      lastHitAt = now;
      try{
        const a = hitBase.cloneNode();
        a.volume = 0.9;
        a.play().catch(()=>{});
      }catch(e){}
    }

    let catReady=false, catError=false, zabutonReady=false;
    catImg.onload=()=>{catReady = catImg.naturalWidth>0 && catImg.naturalHeight>0;};
    catImg.onerror=()=>{catError=true;};
    zabutonImg.onload=()=>{zabutonReady=true;};

    function fitCanvas(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
    fitCanvas(); window.addEventListener('resize', fitCanvas);

    const clampLevel = (n)=> Math.min(3, Math.max(1, n));
    let level = 1;

    const world={ width:()=>canvas.width, height:()=>canvas.height, holeR:26 };
    const rng=(a,b)=>Math.random()*(b-a)+a;

    // Ball & tuning
    const ball={ x:120, y:120, r:80, vx:60, vy:35, rotation:0 };
    const IMG_SCALE=0.7, SPEED_SCALE=0.5, ROT_SPEED=0.25;

    // Stage entities/state
    let walls=[];
    let win=false, goalAnim=0, goal=null, postWinHandled=false;

    // Overlay (NEXT STAGE! / Congratulations!)
    let msgText = '';
    let msgTimer = 0;
    const MSG_DUR = 1.5;
    let awaitingTap = false;   // true when waiting for tap on NEXT STAGE
    let msgType = null;        // 'next' | 'congrats' | null
    let msgRect = null;        // tappable rect for NEXT STAGE

    function setMessage(t, type){
      msgText=t; msgTimer=0; msgType=type||null;
      awaitingTap = (msgType === 'next');
    }

    function applyBackground(){
      // Level 1 => back.png, Level 2 => back2.png, Level 3 => back.png
      const url = (level === 2) ? 'back2.png' : 'back.png';
      document.body.style.backgroundImage = `url('${url}')`;
    }

    function makeLevel(){
      applyBackground();
      const W=world.width(), H=world.height();
      ball.x=rng(40,80); ball.y=rng(40,80);
      const base=70+(level-1)*12;
      const sp=base*SPEED_SCALE;
      const ang=rng(0,Math.PI*2);
      ball.vx=Math.cos(ang)*sp; ball.vy=Math.sin(ang)*sp;

      // short zabuton bar
      const w=100,h=25,x=W/2-w/2,y=H-120;
      walls=[{x,y,w,h,id:0,draggable:true}];

      win=false; goalAnim=0; goal=null; postWinHandled=false;
      msgText=''; msgType=null; awaitingTap=false; msgRect=null;
    }

    function resetLevel(){ makeLevel(); }

    // Drag handling + tap-to-next
    let dragId=null, dragOffset={x:0,y:0};
    function posFromEvent(e){ if(e.touches&&e.touches.length){const t=e.touches[0];return{x:t.clientX,y:t.clientY};} return{x:e.clientX,y:e.clientY}; }

    function onDown(e){
      const p=posFromEvent(e);

      // If waiting on NEXT STAGE tap, prioritize click on label
      if (awaitingTap && msgRect){
        const {x,y,w,h} = msgRect;
        if (p.x >= x && p.x <= x+w && p.y >= y-h*0.8 && p.y <= y + h*0.2){ // generous hitbox
          // advance stage
          level = clampLevel(level+1);
          resetLevel();
          e.preventDefault();
          return;
        }
      }

      const w = walls[0];
      if(p.x>=w.x&&p.x<=w.x+w.w&&p.y>=w.y&&p.y<=w.y+w.h){
        dragId=w.id; dragOffset.x=p.x-w.x; dragOffset.y=p.y-w.y;
      }
      e.preventDefault();
    }
    function onMove(e){ if(dragId===null) return; const p=posFromEvent(e); const w=walls[0]; w.x=Math.min(world.width()-w.w, Math.max(0, p.x-dragOffset.x)); w.y=Math.min(world.height()-w.h, Math.max(0, p.y-dragOffset.y)); e.preventDefault(); }
    function onUp(e){ dragId=null; e.preventDefault(); }
    canvas.addEventListener('touchstart', onDown, {passive:false});
    canvas.addEventListener('touchmove', onMove, {passive:false});
    canvas.addEventListener('touchend', onUp, {passive:false});
    canvas.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);

    // Collision helpers
    function circleRectCollide(cx,cy,cr,rx,ry,rw,rh){
      const closestX=Math.max(rx,Math.min(cx,rx+rw));
      const closestY=Math.max(ry,Math.min(cy,ry+rh));
      const dx=cx-closestX, dy=cy-closestY;
      return dx*dx + dy*dy <= cr*cr;
    }
    function reflectOnRect(ball,rect){
      const{ x:cx,y:cy,r:cr}=ball; const{ x:rx,y:ry,w:rw,h:rh}=rect;
      const penLeft=Math.abs((cx+cr)-rx);
      const penRight=Math.abs((rx+rw)-(cx-cr));
      const penTop=Math.abs((cy+cr)-ry);
      const penBottom=Math.abs((ry+rh)-(cy-cr));
      const minPen=Math.min(penLeft,penRight,penTop,penBottom);
      const restitution=0.98;
      if(minPen===penLeft){ball.x=rx-cr;ball.vx=-Math.abs(ball.vx)*restitution;}
      else if(minPen===penRight){ball.x=rx+rw+cr;ball.vx=Math.abs(ball.vx)*restitution;}
      else if(minPen===penTop){ball.y=ry-cr;ball.vy=-Math.abs(ball.vy)*restitution;}
      else{ball.y=ry+rh+cr;ball.vy=Math.abs(ball.vy)*restitution;}
      playHit();
    }

    let last=performance.now();

    function update(dt){
      if (msgText && msgType !== 'next') msgTimer += dt; // 'next' waits for tap, no timer fade
      ball.rotation += dt*0.25;

      if (!win){
        ball.x += ball.vx*dt;
        ball.y += ball.vy*dt;

        if(ball.x-ball.r<0){ball.x=ball.r;ball.vx=Math.abs(ball.vx);playHit();}
        if(ball.x+ball.r>world.width()){ball.x=world.width()-ball.r;ball.vx=-Math.abs(ball.vx);playHit();}
        if(ball.y-ball.r<0){ball.y=ball.r;ball.vy=Math.abs(ball.vy);playHit();}
        if(ball.y+ball.r>world.height()){ball.y=world.height()-ball.r;ball.vy=-Math.abs(ball.vy);playHit();}

        const w=walls[0];
        if(circleRectCollide(ball.x,ball.y,ball.r,w.x,w.y,w.w,w.h)) reflectOnRect(ball,w);

        const hx=world.width()/2, hy=world.height()/2, hr=world.holeR;
        const dx=ball.x-hx, dy=ball.y-hy, d2=dx*dx+dy*dy;
        if (d2 < hr*hr){
          win = true;
          goalAnim = 0;
          goal = { hx, hy, sx: ball.x, sy: ball.y };
          ball.vx = 0; ball.vy = 0;
        }
      } else {
        if (goal && goalAnim < 1){
          goalAnim = Math.min(1, goalAnim + dt / 0.9);
          const t = goalAnim*goalAnim;
          ball.x = goal.sx + (goal.hx - goal.sx)*t;
          ball.y = goal.sy + (goal.hy - goal.sy)*t;
        }
        if (!postWinHandled && goalAnim >= 1){
          postWinHandled = true;
          if (level < 3){
            setMessage('NEXT STAGE!', 'next');  // wait for tap
          } else {
            setMessage('Congratulations!', 'congrats'); // fade out
          }
        }
      }
    }

    function draw(){
      const W=world.width(), H=world.height();
      ctx.clearRect(0,0,W,H);

      // hole
      const hx=W/2, hy=H/2, hr=world.holeR;
      ctx.fillStyle='rgba(0,0,0,0.8)';
      ctx.beginPath(); ctx.arc(hx,hy,hr,0,Math.PI*2); ctx.fill();

      // bar (zabuton)
      const w=walls[0];
      if (zabutonReady){
        ctx.drawImage(zabutonImg, w.x, w.y, w.w, w.h);
      } else {
        ctx.fillStyle='rgba(0,255,255,0.4)';
        ctx.beginPath(); ctx.roundRect(w.x,w.y,w.w,w.h,10); ctx.fill();
      }

      // shrink during suction
      const shrink = win ? (1 - 0.85*(goalAnim*goalAnim)) : 1;
      const drawScale = IMG_SCALE * shrink;

      // cat ball
      if (catReady && !catError && catImg.naturalWidth>0){
        ctx.save();
        ctx.translate(ball.x, ball.y);
        ctx.rotate(ball.rotation);
        const size = ball.r*2*drawScale;
        try { ctx.drawImage(catImg, -size/2, -size/2, size, size); }
        catch(e){ catError=true; }
        ctx.restore();
      } else {
        ctx.fillStyle='#10b981';
        ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r*drawScale,0,Math.PI*2); ctx.fill();
      }

      // overlay message
      msgRect = null;
      if (msgText){
        let alpha = 1;
        if (msgType !== 'next'){ // fade only for congrats
          const t = Math.min(1, msgTimer/MSG_DUR);
          alpha = 1 - t;
        }
        if (alpha > 0){
          ctx.save();
          ctx.globalAlpha = alpha;
          // BIGGER text per request
          const fontSize = Math.max(36, Math.min(W, H) * 0.12); // 12% of short side
          ctx.font = `800 ${fontSize}px system-ui, -apple-system`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          const x = W/2;
          const y = H*0.25;
          // tappable background for NEXT STAGE
          const metrics = ctx.measureText(msgText);
          const tw = metrics.width;
          const th = fontSize * 1.2;
          const pad = 24;
          if (msgType === 'next'){
            const rx = x - tw/2 - pad;
            const ry = y - th/2 - pad/2;
            const rw = tw + pad*2;
            const rh = th + pad;
            // button bg
            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            roundRect(ctx, rx, ry, rw, rh, 14); ctx.fill();
            // store hit rect
            msgRect = { x: rx, y: ry, w: rw, h: rh };
          }
          ctx.fillStyle = '#ffffff';
          ctx.fillText(msgText, x, y);
          ctx.restore();
        }
      }
    }

    function roundRect(ctx, x,y,w,h,r){
      const rr = Math.min(r, w/2, h/2);
      ctx.beginPath();
      ctx.moveTo(x+rr, y);
      ctx.arcTo(x+w, y, x+w, y+h, rr);
      ctx.arcTo(x+w, y+h, x, y+h, rr);
      ctx.arcTo(x, y+h, x, y, rr);
      ctx.arcTo(x, y, x+w, y, rr);
      ctx.closePath();
    }

    function loop(ts){ const dt=Math.min(0.032,(ts-last)/1000); last=ts; update(dt); draw(); requestAnimationFrame(loop); }
    requestAnimationFrame(loop);

    // Start
    resetLevel();
  })();
  </script>
</body>
</html>
