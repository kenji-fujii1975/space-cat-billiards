<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>WallSlide Pool</title>
  <style>
    html, body { margin:0; height:100%; overflow:hidden; }
    body { background:#000; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP"; }
    #canvas { position:fixed; inset:0; width:100vw; height:100vh; display:block; touch-action:none; background:transparent; }
    /* 画像オーバーレイ（タイトル/エンディング用。キャンバス非依存） */
    #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:auto; cursor:pointer; }
    #overlay img { max-width:100%; max-height:100%; object-fit:contain; pointer-events:none; -webkit-user-drag:none; user-select:none; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="overlay" aria-label="screen overlay"><img id="overlayImg" alt="overlay" /></div>

  <script>
  // DOM 完全読込後に起動（IIFE 由来の構文エラーを回避）
  document.addEventListener('DOMContentLoaded', function(){
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayImg = document.getElementById('overlayImg');

    // ===== Assets =====
    const catImg = new Image(); catImg.decoding='async'; catImg.src='catball.png';
    const zabutonImg = new Image(); zabutonImg.decoding='async'; zabutonImg.src='zabuton.png';
    const topImg = new Image(); topImg.decoding='async'; topImg.src='top.png';
    const endImg = new Image(); endImg.decoding='async'; endImg.src='end.png';
    const hitBase = new Audio('cat.mp3'); hitBase.preload='auto';
    const bgm = new Audio('catballbgm.mp3'); bgm.preload='auto'; bgm.loop=true; bgm.volume=0.4;
    const endBgm = new Audio('endbgm.mp3'); endBgm.preload='auto'; endBgm.loop=true; endBgm.volume=0.4;

    // ===== State =====
    function fit(){ canvas.width = innerWidth; canvas.height = innerHeight; } fit(); addEventListener('resize', fit);
    const world = { width:()=>canvas.width, height:()=>canvas.height, holeR:34 };
    let level=1; const clampLevel=n=>Math.min(3, Math.max(1,n));
    let gameState='title'; // 'title' | 'play' | 'ending'

    // ball
    const ball={ x:120, y:120, r:80, vx:60, vy:35, rotation:0 };
    const IMG_SCALE=0.7, SPEED_SCALE=0.5, ROT_SPEED=0.25;

    // 吸い込み・捕獲（なめらかなスプリング吸引）
    const CAPTURE_MARGIN = 0.9;            // 捕獲半径をやや広め
    const SUCTION_DIST_MULT = 3.2;         // 吸引をかけ始める距離（holeRの何倍）
    const SPRING_K = 600;                  // ばね係数（大きいほど中心へ強く引く）
    const DAMPING_C = 1.8;                 // 減衰係数（速度に比例して減速）
    const TANGENTIAL_DAMP = 0.7;           // 接線方向の減衰（回り込みを抑える）
    const SUCTION_SKIP_COLLIDE = 1.0;      // 吸引域では壁反射スキップ
    const VEL_CAPTURE_THRESH = 80;         // 低速捕獲の速度閾値(px/s)
    const AUTO_CAPTURE_DIST_MULT = 1.6;    // これ未満の距離で自動捕獲モードへ
    const AUTO_CAPTURE_TIME = 0.7;         // 自動捕獲の所要時間(秒)

    let walls=[]; let win=false, goalAnim=0, goal=null, postWinHandled=false; let hiddenAfterWin=false; let pendingEnding=0;

    // 自動捕獲モード（スムーズに中心へ吸い込む）
    let capturing=false, captureT=0, captureStart=null;

    // messages
    let msgText=''; let msgTimer=0; const MSG_DUR=1.5; let awaitingTap=false; let msgType=null; let msgRect=null;

    let catReady=false, catError=false, zabutonReady=false; 
    catImg.onload=function(){catReady=true}; 
    catImg.onerror=function(){catError=true}; 
    zabutonImg.onload=function(){zabutonReady=true};

    // ===== Audio =====
    let audioUnlocked=false, lastHitAt=0;
    function unlockAudioOnce(){
      if (audioUnlocked) return;
      const tasks=[];
      try{
        hitBase.volume=0; tasks.push(hitBase.play().then(function(){hitBase.pause(); hitBase.currentTime=0; hitBase.volume=1;}));
      }catch(_){ }
      try{
        bgm.volume=0; tasks.push(bgm.play().then(function(){bgm.pause(); bgm.currentTime=0; bgm.volume=0.4;}));
      }catch(_){ }
      try{
        endBgm.volume=0; tasks.push(endBgm.play().then(function(){endBgm.pause(); endBgm.currentTime=0; endBgm.volume=0.4;}));
      }catch(_){ }
      audioUnlocked=true;
      Promise.allSettled(tasks).finally(function(){});
    }
    function playBgm(){ try{ if (bgm.paused) { bgm.currentTime=0; bgm.play().catch(function(){}); } }catch(_){} }
    function stopBgm(){ try{ if (!bgm.paused) bgm.pause(); }catch(_){} }
    function playEndBgm(){ try{ if (endBgm.paused) { endBgm.currentTime=0; endBgm.play().catch(function(){}); } }catch(_){} }
    function stopEndBgm(){ try{ if (!endBgm.paused) endBgm.pause(); }catch(_){} }catch(_){} }
    function playHit(){ const now=performance.now(); if (now-lastHitAt<120) return; lastHitAt=now; try{ const a=hitBase.cloneNode(); a.volume=0.9; a.play().catch(function(){});}catch(_){}}

    // ===== UI States =====
    function showOverlay(src){ overlayImg.src = src; overlay.style.display='flex'; }
    function hideOverlay(){ overlay.style.display='none'; overlayImg.removeAttribute('src'); }

    function applyBackground(){
      let url='back.png'; if (level===2) url='back2.png'; if (level===3) url='back3.png';
      document.body.style.backgroundImage = "url('"+url+"')";
      document.body.style.backgroundPosition='center center'; document.body.style.backgroundRepeat='no-repeat'; document.body.style.backgroundSize='cover'; document.body.style.backgroundAttachment='fixed';
    }

    function makeLevel(){
      applyBackground();
      const W=world.width(), H=world.height();
      // velocity reset
      const base=70+(level-1)*12; const sp=base*SPEED_SCALE; const ang=Math.random()*Math.PI*2;
      ball.vx=Math.cos(ang)*sp; ball.vy=Math.sin(ang)*sp; ball.x=W*0.25; ball.y=H*0.25; ball.rotation=0;
      const w=100,h=25; walls=[{x:W/2-w/2,y:H-120,w,h,id:0,draggable:true}];
      win=false; goalAnim=0; goal=null; postWinHandled=false; hiddenAfterWin=false; msgText=''; msgType=null; awaitingTap=false; msgRect=null;
      capturing=false; captureT=0; captureStart=null;
    }

    function startGame(){
      gameState='play'; level=1; hideOverlay(); document.body.style.backgroundColor='#000';
      unlockAudioOnce(); stopEndBgm(); playBgm();
      hiddenAfterWin=false;
      makeLevel();
    }

    function goTitle(){
      stopEndBgm(); stopBgm(); gameState='title'; level=1; win=false; postWinHandled=false; goal=null; goalAnim=0; hiddenAfterWin=false; msgText=''; awaitingTap=false; msgType=null; msgRect=null;
      document.body.style.background='#000'; document.body.style.backgroundImage='none';
      showOverlay('top.png');
    }
    function goEnding(){
      stopBgm();
      gameState='ending';
      // エンディングではステージ背景が見えないよう完全に黒背景
      document.body.style.backgroundColor = '#000';
      document.body.style.backgroundImage = 'none';
      showOverlay('end.png');
      playEndBgm();
    }
    }

    // ===== Input =====
    function posFromEvent(e){ if(e && e.touches && e.touches.length){const t=e.touches[0]; return {x:t.clientX,y:t.clientY};} if(e && e.changedTouches && e.changedTouches.length){const t=e.changedTouches[0]; return {x:t.clientX,y:t.clientY};} return {x:(e?e.clientX:0),y:(e?e.clientY:0)}; }

    // オーバーレイ直付け（タイトル→開始 / エンディング→タイトル）
    function startFromOverlay(e){
      if (gameState === 'title') { startGame(); if(e && e.preventDefault) e.preventDefault(); return; }
      if (gameState === 'ending') { goTitle(); if(e && e.preventDefault) e.preventDefault(); return; }
    }
    ;['pointerdown','touchstart','mousedown','click'].forEach(function(t){
      overlay.addEventListener(t, startFromOverlay, {passive:false});
    });

    function onAnyDown(e){
      const p=posFromEvent(e);
      if (gameState==='title'){ startGame(); if(e && e.preventDefault) e.preventDefault(); return; }
      if (gameState==='ending'){ goTitle(); if(e && e.preventDefault) e.preventDefault(); return; }

      // message button tap
      if (awaitingTap && msgRect){ const x=msgRect.x,y=msgRect.y,w=msgRect.w,h=msgRect.h; if(p.x>=x&&p.x<=x+w&&p.y>=y&&p.y<=y+h){ if (msgType==='next'){ level=clampLevel(level+1);} else if (msgType==='congratsTap'){ level=1;} awaitingTap=false; msgText=''; msgType=null; msgRect=null; makeLevel(); if(e && e.preventDefault) e.preventDefault(); return; } }

      // drag start
      const wb=walls[0]; if (wb && p.x>=wb.x&&p.x<=wb.x+wb.w&&p.y>=wb.y&&p.y<=wb.y+wb.h){ dragging=true; dragOffset.x=p.x-wb.x; dragOffset.y=p.y-wb.y; }
      if(e && e.preventDefault) e.preventDefault();
    }
    let dragging=false; const dragOffset={x:0,y:0};
    function onMove(e){ if(!dragging||gameState!=='play') return; const p=posFromEvent(e); const w=walls[0]; if(!w) return; w.x=Math.min(world.width()-w.w, Math.max(0, p.x-dragOffset.x)); w.y=Math.min(world.height()-w.h, Math.max(0, p.y-dragOffset.y)); if(e && e.preventDefault) e.preventDefault(); }
    function onUp(){ dragging=false; }

    // attach listeners globally
    ;['mousedown','touchstart','pointerdown','click'].forEach(function(t){ addEventListener(t,onAnyDown,{passive:false}); });
    ;['mousemove','touchmove','pointermove'].forEach(function(t){ addEventListener(t,onMove,{passive:false}); });
    ;['mouseup','touchend','pointerup','pointercancel'].forEach(function(t){ addEventListener(t,onUp,{passive:true}); });

    // ===== Physics & Render =====
    function circleRectCollide(cx,cy,cr,rx,ry,rw,rh){ const closestX=Math.max(rx,Math.min(cx,rx+rw)); const closestY=Math.max(ry,Math.min(cy,ry+rh)); const dx=cx-closestX, dy=cy-closestY; return dx*dx+dy*dy<=cr*cr; }
    function reflectOnRect(ball,rect){ const cx=ball.x, cy=ball.y, cr=ball.r; const rx=rect.x, ry=rect.y, rw=rect.w, rh=rect.h; const penLeft=Math.abs((cx+cr)-rx); const penRight=Math.abs((rx+rw)-(cx-cr)); const penTop=Math.abs((cy+cr)-ry); const penBottom=Math.abs((ry+rh)-(cy-cr)); const minPen=Math.min(penLeft,penRight,penTop,penBottom); const restitution=0.98; if(minPen===penLeft){ball.x=rx-cr;ball.vx=-Math.abs(ball.vx)*restitution;} else if(minPen===penRight){ball.x=rx+rw+cr;ball.vx=Math.abs(ball.vx)*restitution;} else if(minPen===penTop){ball.y=ry-cr;ball.vy=-Math.abs(ball.vy)*restitution;} else {ball.y=ry+rh+cr;ball.vy=Math.abs(ball.vy)*restitution;} playHit(); }

    let last=performance.now();
    function update(dt){
      if (gameState!=='play') return;
      if (msgText && msgType!=='next' && msgType!=='congratsTap') msgTimer+=dt; ball.rotation+=dt*ROT_SPEED;

      // 位置更新（自動捕獲中は位置更新を専用処理に任せる）
      if (!capturing){
        ball.x += ball.vx*dt; 
        ball.y += ball.vy*dt;
      }

      // 画面端反射（自動捕獲中は無効化）
      if(!capturing){
        if(ball.x-ball.r<0){ball.x=ball.r;ball.vx=Math.abs(ball.vx);playHit();}
        if(ball.x+ball.r>world.width()){ball.x=world.width()-ball.r;ball.vx=-Math.abs(ball.vx);playHit();}
        if(ball.y-ball.r<0){ball.y=ball.r;ball.vy=Math.abs(ball.vy);playHit();}
        if(ball.y+ball.r>world.height()){ball.y=world.height()-ball.r;ball.vy=-Math.abs(ball.vy);playHit();}
      }

      // 中心との距離
      const hx=world.width()/2, hy=world.height()/2, hr=world.holeR;
      const dx=ball.x-hx, dy=ball.y-hy; 
      const dist=Math.hypot(dx,dy);

      const captureR = hr + ball.r*CAPTURE_MARGIN;      // 広めの捕獲半径
      const suctionR = Math.max(captureR, hr*SUCTION_DIST_MULT);
      const suctionActive = dist < suctionR;

      // 吸引（なめらかなスプリング＋粘性減衰）
      if (!capturing && suctionActive && dist >= captureR){
        const dxn = (hx - ball.x); // 生の距離ベクトル
        const dyn = (hy - ball.y);
        // ばね力: K*(x_target - x) → 中心へ
        let ax = (SPRING_K * dxn) - (DAMPING_C * ball.vx);
        let ay = (SPRING_K * dyn) - (DAMPING_C * ball.vy);
        // 接線成分を弱めて、回り込みを抑える
        const distN = Math.hypot(dxn, dyn) || 1;
        const nx = dxn / distN, ny = dyn / distN;
        const tx = -ny, ty = nx;
        const vt = ball.vx * tx + ball.vy * ty;
        const vtDamped = vt * TANGENTIAL_DAMP;
        const vr = ball.vx * nx + ball.vy * ny;
        // 減衰後の目標速度へ近づけるよう補正
        const vxTarget = vr * nx + vtDamped * tx;
        const vyTarget = vr * ny + vtDamped * ty;
        ax += (vxTarget - ball.vx) * 60; // 穏やかな補正
        ay += (vyTarget - ball.vy) * 60;
        // 速度更新
        ball.vx += ax * dt;
        ball.vy += ay * dt;
      }

      // リム付近や低速なら即「自動捕獲モード」へ
      const speed = Math.hypot(ball.vx, ball.vy);
      if (!win && !capturing && (dist <= captureR * 1.02 || (dist < captureR * 1.15 && speed < VEL_CAPTURE_THRESH))){
        capturing = true; captureT = 0; captureStart = {x:ball.x, y:ball.y};
        ball.vx = 0; ball.vy = 0;
      }

      // 一定距離以内なら「自動捕獲モード」で位置を補間（停止を防ぐ）
      if (!win && !capturing && dist < (hr * AUTO_CAPTURE_DIST_MULT + ball.r*0.2)){
        capturing = true; captureT = 0; captureStart = {x:ball.x, y:ball.y};
        // 以降の反射・衝突は無効化し、速度もゼロにして補間に委ねる
        ball.vx = 0; ball.vy = 0;
      }

      if (capturing){
        captureT += dt / AUTO_CAPTURE_TIME;
        const t = Math.min(1, captureT);
        const tt = t*t; // イーズイン
        ball.x = captureStart.x + (hx - captureStart.x) * tt;
        ball.y = captureStart.y + (hy - captureStart.y) * tt;
        if (t >= 1){
          capturing = false;
          win = true;
          goalAnim = 0;
          goal = {hx: hx, hy: hy, sx: ball.x, sy: ball.y};
        }
      }

      // 壁との衝突（吸引域ではスキップ）
      const w=walls[0];
      if(w && !capturing){
        const nearForSkip = suctionActive && dist < (hr * SUCTION_DIST_MULT * SUCTION_SKIP_COLLIDE);
        if (!nearForSkip && circleRectCollide(ball.x,ball.y,ball.r,w.x,w.y,w.w,w.h)){
          reflectOnRect(ball,w);
        }
      }

      // ゴール判定（広め）→ 直接勝利にはせず、補間で必ず吸い込む
      if (!win && !capturing && dist < captureR){
        capturing = true; captureT = 0; captureStart = {x:ball.x, y:ball.y};
        ball.vx = 0; ball.vy = 0;
      }

      // 勝利後アニメ
      if (win){
        if(goal && goalAnim<1){
          goalAnim=Math.min(1, goalAnim+dt/0.9);
          const t2=goalAnim*goalAnim;
          ball.x=goal.sx+(goal.hx-goal.sx)*t2; 
          ball.y=goal.sy+(goal.hy-goal.sy)*t2;
        }
        if(!postWinHandled && goalAnim>=1){
          hiddenAfterWin = true; // 完全に消す
          postWinHandled=true;
          if(level<3){
            setMessage('NEXT STAGE!','next');
          }else{
            // ステージ3クリア後は2秒だけ投影してからエンディングへ
            pendingEnding = 2.0;
          }
        }
        // レベル3クリア後のエンディング遅延を処理
        if (pendingEnding > 0){
          pendingEnding -= dt;
          if (pendingEnding <= 0){
            goEnding();
          }
        }
      }
    }

    function setMessage(t,type){ msgText=t; msgTimer=0; msgType=type||null; awaitingTap=(msgType==='next'||msgType==='congratsTap'); }

    function draw(){
      const W=world.width(), H=world.height(); ctx.clearRect(0,0,W,H);
      if (gameState!=='play') return; // title/endingはDOMオーバーレイで描画
      // bar
      const w=walls[0]; if (zabutonReady && w){ ctx.drawImage(zabutonImg, w.x,w.y,w.w,w.h); } else if (w){ pathRoundRect(ctx,w.x,w.y,w.w,w.h,10); ctx.fillStyle='rgba(0,255,255,0.4)'; ctx.fill(); }
      // cat
      const shrink = win ? Math.max(0, 1 - goalAnim) : 1; const drawScale = IMG_SCALE*shrink;
      if (!hiddenAfterWin && catReady && !catError && catImg.naturalWidth>0){ ctx.save(); ctx.translate(ball.x,ball.y); ctx.rotate(ball.rotation); const size=ball.r*2*drawScale; if (size>0.5){ try{ ctx.drawImage(catImg,-size/2,-size/2,size,size); }catch(_){ catError=true; } } ctx.restore(); } else { ctx.fillStyle='#10b981'; ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r*drawScale,0,Math.PI*2); ctx.fill(); }
      // overlay message
      msgRect=null; if (msgText){ let alpha=1; if (msgType!=='next'&&msgType!=='congratsTap'){ const t=Math.min(1,msgTimer/MSG_DUR); alpha=1-t; } if(alpha>0){ ctx.save(); ctx.globalAlpha=alpha; const fontSize=Math.max(36, Math.min(W,H)*0.12); ctx.font="900 "+fontSize+"px system-ui, -apple-system"; ctx.textAlign='center'; ctx.textBaseline='middle'; const x=W/2,y=H*0.25; const tw=ctx.measureText(msgText).width, th=fontSize*1.2, pad=24; if(awaitingTap){ const rx=x-tw/2-pad, ry=y-th/2-pad/2, rw=tw+pad*2, rh=th+pad; pathRoundRect(ctx,rx,ry,rw,rh,14); ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fill(); msgRect={x:rx,y:ry,w:rw,h:rh}; } ctx.fillStyle='#fff'; ctx.fillText(msgText,x,y); ctx.restore(); } }
    }

    function pathRoundRect(ctx,x,y,w,h,r){ const rr=Math.max(0, Math.min(r,w/2,h/2)); ctx.beginPath(); ctx.moveTo(x+rr,y); ctx.lineTo(x+w-rr,y); ctx.quadraticCurveTo(x+w,y,x+w,y+rr); ctx.lineTo(x+w,y+h-rr); ctx.quadraticCurveTo(x+w,y+h,x+w-rr,y+h); ctx.lineTo(x+rr,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-rr); ctx.lineTo(x,y+rr); ctx.quadraticCurveTo(x,y,x+rr,y); ctx.closePath(); }

    function loop(ts){ const dt=Math.min(0.032,(ts-last)/1000); last=ts; try{ update(dt); draw(); }catch(e){ console.error('render error',e);} requestAnimationFrame(loop); }
    requestAnimationFrame(loop);

    // ===== Init =====
    goTitle();

    // ===== Minimal tests =====
    function assert(name,cond){ const pass=!!cond; if(!pass) console.error('[TEST FAIL]',name); else console.log('[TEST OK]',name); }
    assert('initial state is title', gameState==='title');
    assert('bgm loop', bgm.loop===true);
    assert('endBgm loop', endBgm.loop===true);
    (function(){ const hit=circleRectCollide(50,50,20,40,40,40,10); const miss=circleRectCollide(10,10,5,40,40,40,10); assert('circle-rect hit',hit===true); assert('circle-rect miss',miss===false); })();
    // 追加テスト: 定数と関数の存在確認
    assert('AUTO_CAPTURE_TIME positive', AUTO_CAPTURE_TIME>0);
    assert('goEnding is function', typeof goEnding==='function');
    assert('applyBackground available', typeof applyBackground==='function');
  });
  </script>
</body>
</html>
